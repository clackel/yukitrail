spring:
  application:
    name: yukitrail-api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:yukitrail}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:yukitrail}
    password: ${DB_PASSWORD:yukitrail-local}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  jackson:
    time-zone: UTC

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:mapper/**/*.xml

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

yukitrail:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  auth:
    issuer: ${JWT_ISSUER:https://api.yukitrail.local}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:30d}
    cookie-name: yukitrail_refresh
    cookie-path: /api/v1/auth
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    keys-required: ${JWT_KEYS_REQUIRED:false}
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
