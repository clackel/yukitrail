name: yukitrail

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      TZ: UTC
      MYSQL_DATABASE: ${DB_NAME:-yukitrail}
      MYSQL_USER: ${DB_USERNAME:-yukitrail}
      MYSQL_PASSWORD: ${DB_PASSWORD:-yukitrail-local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-yukitrail-root-local}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:

